




<!DOCTYPE html>
<html lang="ne">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Video Loading...</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            background-color: #0f0f0f;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .video-container {
            width: 90%;
            max-width: 700px;
            background-color: #000;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0px 10px 30px rgba(0, 0, 0, 0.8);
            border: 1px solid #333;
            position: relative;
        }

        /* Fake Video Screen */
        .video-screen {
            width: 100%;
            height: 380px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            position: relative;
            background: linear-gradient(135deg, #1f1c2c, #928dab);
        }

        /* Spinner / Loader */
        .spinner {
            width: 60px;
            height: 60px;
            border: 6px solid rgba(255, 255, 255, 0.2);
            border-top: 6px solid #e50914; /* Red color like YouTube/Netflix */
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 20px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* Counter Text */
        .counter-text {
            font-size: 24px;
            font-weight: bold;
            letter-spacing: 1px;
        }

        /* Net Slow Error UI */
        .error-box {
            display: none;
            text-align: center;
            padding: 20px;
        }

        .error-icon {
            font-size: 50px;
            margin-bottom: 10px;
            color: #ff4757;
        }

        .error-title {
            font-size: 20px;
            font-weight: bold;
            margin-bottom: 8px;
            color: #ff4757;
        }

        .error-desc {
            font-size: 14px;
            color: #ccc;
        }

        /* Fake Video Controls */
        .video-controls {
            background-color: #181818;
            padding: 15px;
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .play-btn {
            background: none;
            border: none;
            color: white;
            font-size: 18px;
            cursor: pointer;
        }

        .progress-bar-container {
            flex-grow: 1;
            height: 5px;
            background-color: #444;
            border-radius: 5px;
            overflow: hidden;
            position: relative;
        }

        .progress-bar {
            height: 100%;
            width: 0%;
            background-color: #e50914;
            transition: width 0.1s linear;
        }

        .live-tag {
            background-color: #e50914;
            padding: 3px 8px;
            font-size: 12px;
            font-weight: bold;
            border-radius: 3px;
            text-transform: uppercase;
        }
    </style>
</head>
<body>

    <div class="video-container">
        <!-- Video Display Area -->
        <div class="video-screen">
            
            <!-- Loading Section (Suruma Yo Dekhinchha) -->
            <div id="loading-section">
                <div class="spinner" id="spinner"></div>
                <div class="counter-text">
                    Video Loading... <span id="counter">0</span>%
                </div>
            </div>

            <!-- Net Slow / Error Section (Lastma Yo Dekhinchha) -->
            <div class="error-box" id="error-section">
                <div class="spinner"></div>
                <div class="error-icon">⚠️</div>
                <div class="error-title">Network Connection Slow!</div>
                <div class="error-desc">Buffering... Please check your internet speed and try again.</div>
            </div>

        </div>

        <!-- Video Control Bar -->
        <div class="video-controls">
            <button class="play-btn">▶</button>
            <div class="progress-bar-container">
                <div class="progress-bar" id="progress-bar"></div>
            </div>
            <span class="live-tag">LIVE</span>
        </div>
    </div>

    <script>
        let count = 0;
        const counterElement = document.getElementById('counter');
        const progressBar = document.getElementById('progress-bar');
        const loadingSection = document.getElementById('loading-section');
        const errorSection = document.getElementById('error-section');

        // Fast counter suruma, pachi slow hunchha net slow bhako dekhauna
        const interval = setInterval(() => {
            count++;
            counterElement.innerText = count;
            progressBar.style.width = count + '%';

            // 99% puryaepachi net slow / stuck bhako jasto dekhaune
            if (count >= 99) {
                clearInterval(interval);
                
                // 1 sec pachi net slow error message dekhaune
                setTimeout(() => {
                    loadingSection.style.display = 'none';
                    errorSection.style.display = 'block';
                }, 1000);
            }
        }, 50); // Speed adjust garna yeta number chainge garna saknuounchha
    </script>

</body>
</html>
