<!DOCTYPE html>
<html lang="ne">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Call Break Scoreboard</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #0f172a;
            color: #f8fafc;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        h1 {
            font-size: 2.5rem;
            color: #38bdf8;
            margin-bottom: 20px;
            text-align: center;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .container {
            width: 100%;
            max-width: 1000px;
            background: #1e293b;
            padding: 25px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        }

        /* Player Setup Screen */
        .setup-section {
            display: flex;
            flex-direction: column;
            gap: 15px;
            max-width: 500px;
            margin: 0 auto;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        label {
            font-size: 1.1rem;
            color: #94a3b8;
        }

        input[type="text"], input[type="number"] {
            padding: 12px 15px;
            border-radius: 8px;
            border: 2px solid #334155;
            background: #0f172a;
            color: #fff;
            font-size: 1.1rem;
            outline: none;
            transition: border-color 0.3s;
        }

        input[type="text"]:focus, input[type="number"]:focus {
            border-color: #38bdf8;
        }

        .btn {
            padding: 12px 20px;
            font-size: 1.2rem;
            font-weight: bold;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .btn-primary {
            background-color: #0284c7;
            color: white;
        }

        .btn-primary:hover {
            background-color: #0369a1;
        }

        .btn-success {
            background-color: #16a34a;
            color: white;
        }

        .btn-success:hover {
            background-color: #15803d;
        }

        .btn-danger {
            background-color: #dc2626;
            color: white;
        }

        .btn-danger:hover {
            background-color: #b91c1c;
        }

        /* Main Game Screen */
        .game-section {
            display: none;
            flex-direction: column;
            gap: 25px;
        }

        /* Score Table Style */
        .table-responsive {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: center;
            font-size: 1.3rem;
        }

        th, td {
            padding: 15px;
            border: 1px solid #334155;
        }

        th {
            background-color: #0f172a;
            color: #38bdf8;
            font-size: 1.4rem;
        }

        tr:nth-child(even) {
            background-color: #1e293b;
        }

        tr:nth-child(odd) {
            background-color: #0f172a;
        }

        .total-row {
            background-color: #0369a1 !important;
            font-weight: bold;
            font-size: 1.5rem;
        }

        /* Round Input Section */
        .round-input-container {
            background: #0f172a;
            padding: 20px;
            border-radius: 12px;
            border: 1px solid #334155;
        }

        .round-input-container h2 {
            font-size: 1.5rem;
            margin-bottom: 15px;
            color: #facc15;
            text-align: center;
        }

        .inputs-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
        }

        .player-score-input {
            display: flex;
            flex-direction: column;
            gap: 8px;
            background: #1e293b;
            padding: 12px;
            border-radius: 8px;
        }

        .player-score-input label {
            color: #fff;
            font-weight: bold;
        }

        .controls {
            display: flex;
            justify-content: space-between;
            gap: 15px;
            flex-wrap: wrap;
        }

        /* Display Mode Toggle for Large Screen View */
        .score-big {
            font-size: 2rem;
            font-weight: bold;
            color: #4ade80;
        }

        .score-negative {
            color: #f87171;
        }

        @media (max-width: 600px) {
            h1 { font-size: 1.8rem; }
            th, td { padding: 8px; font-size: 1rem; }
            .total-row { font-size: 1.1rem; }
        }
    </style>
</head>
<body>

    <h1>♠️ Call Break Scoreboard ♠️</h1>

    <div class="container">
        <!-- Step 1: Player Name Entry -->
        <div id="setupSection" class="setup-section">
            <h2 style="text-align: center; color: #38bdf8; margin-bottom: 10px;">Player Names Entry</h2>
            <div class="input-group">
                <label>Player 1 Name:</label>
                <input type="text" id="p1" value="Player 1">
            </div>
            <div class="input-group">
                <label>Player 2 Name:</label>
                <input type="text" id="p2" value="Player 2">
            </div>
            <div class="input-group">
                <label>Player 3 Name:</label>
                <input type="text" id="p3" value="Player 3">
            </div>
            <div class="input-group">
                <label>Player 4 Name:</label>
                <input type="text" id="p4" value="Player 4">
            </div>
            <button class="btn btn-primary" onclick="startGame()" style="margin-top: 15px;">Game Start Garna</button>
        </div>

        <!-- Step 2: Main Game Dashboard -->
        <div id="gameSection" class="game-section">
            
            <!-- Round Input Form -->
            <div class="round-input-container">
                <h2 id="roundTitle">Round 1 Score Entry</h2>
                
                <div class="inputs-grid" id="inputFields">
                    <!-- Dynamic inputs generated here -->
                </div>

                <button class="btn btn-success" style="width: 100%;" onclick="addRoundScore()">Score Save Garna</button>
            </div>

            <!-- Scoreboard Table -->
            <div class="table-responsive">
                <table>
                    <thead>
                        <tr id="tableHeader">
                            <th>Round</th>
                            <!-- Player names will go here -->
                        </tr>
                    </thead>
                    <tbody id="scoreTableBody">
                        <!-- Round scores will go here -->
                    </tbody>
                    <tfoot>
                        <tr class="total-row" id="totalRow">
                            <td>TOTAL</td>
                            <!-- Total scores will go here -->
                        </tr>
                    </tfoot>
                </table>
            </div>

            <!-- Controls (Again Play & Reset) -->
            <div class="controls">
                <button class="btn btn-danger" onclick="resetGame()">Again Play (Restart Game)</button>
            </div>

        </div>
    </div>

    <script>
        let players = [];
        let currentRound = 1;
        let scores = []; // Array to store round-wise scores for each player
        let totals = [0, 0, 0, 0];

        function startGame() {
            const p1 = document.getElementById('p1').value.trim() || 'Player 1';
            const p2 = document.getElementById('p2').value.trim() || 'Player 2';
            const p3 = document.getElementById('p3').value.trim() || 'Player 3';
            const p4 = document.getElementById('p4').value.trim() || 'Player 4';

            players = [p1, p2, p3, p4];

            // Render Table Headers
            const headerRow = document.getElementById('tableHeader');
            headerRow.innerHTML = '<th>Round</th>';
            players.forEach(name => {
                headerRow.innerHTML += `<th>${name}</th>`;
            });

            // Show input form for the current round
            renderInputFields();

            // Render initial total row
            updateTotalRow();

            // Toggle screens
            document.getElementById('setupSection').style.display = 'none';
            document.getElementById('gameSection').style.display = 'flex';
        }

        function renderInputFields() {
            document.getElementById('roundTitle').innerText = `Round ${currentRound} Score Entry`;
            const container = document.getElementById('inputFields');
            container.innerHTML = '';

            players.forEach((player, index) => {
                container.innerHTML += `
                    <div class="player-score-input">
                        <label>${player}</label>
                        <input type="number" id="call_${index}" placeholder="Call (Bid)" min="1" max="13" style="margin-bottom: 5px;">
                        <input type="number" id="made_${index}" placeholder="Hands Made" min="0" max="13">
                    </div>
                `;
            });
        }

        function addRoundScore() {
            let roundScores = [];

            for (let i = 0; i < 4; i++) {
                const callVal = parseFloat(document.getElementById(`call_${i}`).value);
                const madeVal = parseFloat(document.getElementById(`made_${i}`).value);

                if (isNaN(callVal) || isNaN(madeVal)) {
                    alert('Kripaya sabai khiladi ko Call ra Made hands entry garnuhos!');
                    return;
                }

                let score = 0;

                // Call break rule logic
                if (madeVal < callVal) {
                    // Minus score if hands made is less than call
                    score = -callVal;
                } else {
                    // Full call score + 0.1 for each extra hand
                    score = callVal + ((madeVal - callVal) * 0.1);
                }

                // Round to 1 decimal place to avoid floating point issues
                score = Math.round(score * 10) / 10;

                roundScores.push(score);
                totals[i] += score;
                totals[i] = Math.round(totals[i] * 10) / 10;
            }

            // Save to history
            scores.push(roundScores);

            // Add row to table
            const tbody = document.getElementById('scoreTableBody');
            const row = document.createElement('tr');
            
            let rowContent = `<td><strong>R${currentRound}</strong></td>`;
            roundScores.forEach(s => {
                const scoreClass = s < 0 ? 'score-negative' : '';
                rowContent += `<td class="${scoreClass}">${s > 0 ? '+' + s : s}</td>`;
            });

            row.innerHTML = rowContent;
            tbody.appendChild(row);

            // Update Total
            updateTotalRow();

            // Increment Round
            currentRound++;
            renderInputFields();
        }

        function updateTotalRow() {
            const totalRow = document.getElementById('totalRow');
            let content = '<td>TOTAL</td>';
            totals.forEach(t => {
                const scoreClass = t < 0 ? 'score-negative' : '';
                content += `<td class="score-big ${scoreClass}">${t}</td>`;
            });
            totalRow.innerHTML = content;
        }

        function resetGame() {
            if (confirm("Kyu tapai game feri naya bata shuru (Restart) garna chhanhunu hunchha?")) {
                currentRound = 1;
                scores = [];
                totals = [0, 0, 0, 0];

                document.getElementById('scoreTableBody').innerHTML = '';
                document.getElementById('setupSection').style.display = 'flex';
                document.getElementById('gameSection').style.display = 'none';
            }
        }
    </script>
</body>
</html>
