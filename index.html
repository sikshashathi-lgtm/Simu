<!DOCTYPE html>
<html lang="ne">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Call Break Professional Scoreboard</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #0f172a;
            color: #f8fafc;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        h1 {
            font-size: 2.5rem;
            color: #38bdf8;
            margin-bottom: 20px;
            text-align: center;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .container {
            width: 100%;
            max-width: 1000px;
            background: #1e293b;
            padding: 25px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        }

        /* Forms Setup */
        .setup-section {
            display: flex;
            flex-direction: column;
            gap: 15px;
            max-width: 500px;
            margin: 0 auto;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        label {
            font-size: 1.1rem;
            color: #94a3b8;
        }

        input[type="text"], input[type="number"] {
            padding: 12px 15px;
            border-radius: 8px;
            border: 2px solid #334155;
            background: #0f172a;
            color: #fff;
            font-size: 1.2rem;
            outline: none;
            transition: border-color 0.3s;
            text-align: center;
        }

        input[type="text"]:focus, input[type="number"]:focus {
            border-color: #38bdf8;
        }

        .btn {
            padding: 14px 20px;
            font-size: 1.2rem;
            font-weight: bold;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .btn-primary { background-color: #0284c7; color: white; }
        .btn-primary:hover { background-color: #0369a1; }

        .btn-warning { background-color: #d97706; color: white; }
        .btn-warning:hover { background-color: #b45309; }

        .btn-success { background-color: #16a34a; color: white; }
        .btn-success:hover { background-color: #15803d; }

        .btn-danger { background-color: #dc2626; color: white; }
        .btn-danger:hover { background-color: #b91c1c; }

        /* Game Section */
        .game-section {
            display: none;
            flex-direction: column;
            gap: 25px;
        }

        /* Round Box Status */
        .round-status-box {
            background: #0f172a;
            padding: 20px;
            border-radius: 12px;
            border: 2px solid #38bdf8;
        }

        .round-status-box h2 {
            font-size: 1.6rem;
            margin-bottom: 15px;
            color: #facc15;
            text-align: center;
        }

        .inputs-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
        }

        .player-box {
            background: #1e293b;
            padding: 15px;
            border-radius: 8px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            border: 1px solid #334155;
        }

        .player-box .name {
            font-size: 1.2rem;
            font-weight: bold;
            color: #38bdf8;
        }

        .player-box .current-bid {
            font-size: 0.95rem;
            color: #facc15;
        }

        /* Large Table View */
        .table-responsive {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: center;
        }

        th, td {
            padding: 15px;
            border: 1px solid #334155;
        }

        th {
            background-color: #0f172a;
            color: #38bdf8;
            font-size: 1.3rem;
        }

        td {
            font-size: 1.2rem;
        }

        .total-row {
            background-color: #0369a1 !important;
            font-weight: bold;
        }

        .score-big {
            font-size: 2rem;
            font-weight: bold;
            color: #4ade80;
        }

        .score-negative {
            color: #f87171;
        }

        .controls {
            display: flex;
            justify-content: space-between;
            gap: 15px;
        }
    </style>
</head>
<body>

    <h1>♠️ Call Break Scoreboard ♠️</h1>

    <div class="container">
        <!-- Step 1: Player Name Entry -->
        <div id="setupSection" class="setup-section">
            <h2 style="text-align: center; color: #38bdf8;">Khiladi Haruko Naam Insert Garnuhos</h2>
            <div class="input-group">
                <label>Player 1:</label>
                <input type="text" id="p1" value="Player 1">
            </div>
            <div class="input-group">
                <label>Player 2:</label>
                <input type="text" id="p2" value="Player 2">
            </div>
            <div class="input-group">
                <label>Player 3:</label>
                <input type="text" id="p3" value="Player 3">
            </div>
            <div class="input-group">
                <label>Player 4:</label>
                <input type="text" id="p4" value="Player 4">
            </div>
            <button class="btn btn-primary" onclick="startGame()">Game Start Garnuhos</button>
        </div>

        <!-- Step 2: Main Dashboard -->
        <div id="gameSection" class="game-section">
            
            <!-- Dynamic Form (Bid Entry -> Play -> Made Entry) -->
            <div class="round-status-box">
                <h2 id="roundTitle">Round 1: Bid Entry</h2>
                
                <div class="inputs-grid" id="inputFields">
                    <!-- Dynamic fields will be inserted here -->
                </div>

                <div id="actionButtonContainer">
                    <!-- Dynamic action button -->
                </div>
            </div>

            <!-- Score Table -->
            <div class="table-responsive">
                <table>
                    <thead>
                        <tr id="tableHeader">
                            <th>Round</th>
                            <!-- Names -->
                        </tr>
                    </thead>
                    <tbody id="scoreTableBody">
                        <!-- Scores history -->
                    </tbody>
                    <tfoot>
                        <tr class="total-row" id="totalRow">
                            <td>TOTAL</td>
                            <!-- Total Scores -->
                        </tr>
                    </tfoot>
                </table>
            </div>

            <div class="controls">
                <button class="btn btn-danger" style="width: 100%;" onclick="resetGame()">Again Play (New Game)</button>
            </div>

        </div>
    </div>

    <script>
        let players = [];
        let currentRound = 1;
        let currentBids = [0, 0, 0, 0];
        let totals = [0, 0, 0, 0];
        let gameState = 'BIDDING'; // 'BIDDING' or 'RESULT'

        function startGame() {
            const p1 = document.getElementById('p1').value.trim() || 'Player 1';
            const p2 = document.getElementById('p2').value.trim() || 'Player 2';
            const p3 = document.getElementById('p3').value.trim() || 'Player 3';
            const p4 = document.getElementById('p4').value.trim() || 'Player 4';

            players = [p1, p2, p3, p4];

            // Setup Header Table
            const headerRow = document.getElementById('tableHeader');
            headerRow.innerHTML = '<th>Round</th>';
            players.forEach(name => {
                headerRow.innerHTML += `<th>${name}</th>`;
            });

            updateTotalRow();

            document.getElementById('setupSection').style.display = 'none';
            document.getElementById('gameSection').style.display = 'flex';

            startBiddingPhase();
        }

        // STEP 1: Bid/Call garni screen
        function startBiddingPhase() {
            gameState = 'BIDDING';
            document.getElementById('roundTitle').innerText = `Round ${currentRound} : Bid (Call) Entry Garnuhos`;

            const container = document.getElementById('inputFields');
            container.innerHTML = '';

            players.forEach((player, i) => {
                container.innerHTML += `
                    <div class="player-box">
                        <span class="name">${player}</span>
                        <input type="number" id="bid_${i}" placeholder="Bid (1-13)" min="1" max="13">
                    </div>
                `;
            });

            document.getElementById('actionButtonContainer').innerHTML = `
                <button class="btn btn-warning" style="width: 100%;" onclick="submitBids()">Bid Save Garera Khelna Jani 🃏</button>
            `;
        }

        // Save Bids and Change state
        function submitBids() {
            let tempBids = [];
            for (let i = 0; i < 4; i++) {
                const val = parseInt(document.getElementById(`bid_${i}`).value);
                if (isNaN(val) || val < 1 || val > 13) {
                    alert('Kripaya sabai khiladi ko valid Bid (1 bata 13 samma) entry garnuhos!');
                    return;
                }
                tempBids.push(val);
            }

            currentBids = tempBids;
            startResultPhase();
        }

        // STEP 2: Khelisake pachi Made/Hands Entry garni screen
        function startResultPhase() {
            gameState = 'RESULT';
            document.getElementById('roundTitle').innerText = `Round ${currentRound} : Khel Sakiye Pachi Haath (Made) Entry Garnuhos`;

            const container = document.getElementById('inputFields');
            container.innerHTML = '';

            players.forEach((player, i) => {
                container.innerHTML += `
                    <div class="player-box">
                        <span class="name">${player}</span>
                        <span class="current-bid">Bid: ${currentBids[i]}</span>
                        <input type="number" id="made_${i}" placeholder="Hands Made (0-13)" min="0" max="13">
                    </div>
                `;
            });

            document.getElementById('actionButtonContainer').innerHTML = `
                <button class="btn btn-success" style="width: 100%;" onclick="submitResults()">Final Score Save Garnuhos 🎯</button>
            `;
        }

        // Save Made Hands & Calculate Score
        function submitResults() {
            let roundScores = [];

            for (let i = 0; i < 4; i++) {
                const callVal = currentBids[i];
                const madeVal = parseInt(document.getElementById(`made_${i}`).value);

                if (isNaN(madeVal) || madeVal < 0 || madeVal > 13) {
                    alert('Kripaya sabai khiladi ko jiteko Haath (Made) entry garnuhos!');
                    return;
                }

                let score = 0;
                // Score calculation logic
                if (madeVal < callVal) {
                    score = -callVal; // Bid nappugda minus score
                } else {
                    score = callVal + ((madeVal - callVal) * 0.1); // Extra hand point 0.1
                }

                score = Math.round(score * 10) / 10;
                roundScores.push(score);

                totals[i] += score;
                totals[i] = Math.round(totals[i] * 10) / 10;
            }

            // Display Score in Table
            const tbody = document.getElementById('scoreTableBody');
            const row = document.createElement('tr');
            
            let rowContent = `<td><strong>R${currentRound}</strong></td>`;
            roundScores.forEach((s, idx) => {
                const scoreClass = s < 0 ? 'score-negative' : '';
                rowContent += `<td class="${scoreClass}">${s > 0 ? '+' + s : s} <br><small style="color:#aaa; font-size: 0.8rem;">(Bid: ${currentBids[idx]})</small></td>`;
            });

            row.innerHTML = rowContent;
            tbody.appendChild(row);

            // Update Total Scores Display
            updateTotalRow();

            // Next Round Update
            currentRound++;
            startBiddingPhase();
        }

        function updateTotalRow() {
            const totalRow = document.getElementById('totalRow');
            let content = '<td>TOTAL</td>';
            totals.forEach(t => {
                const scoreClass = t < 0 ? 'score-negative' : '';
                content += `<td class="score-big ${scoreClass}">${t}</td>`;
            });
            totalRow.innerHTML = content;
        }

        function resetGame() {
            if (confirm("Kyu tapai feri naya game shuru garna chhanhunu hunchha?")) {
                currentRound = 1;
                totals = [0, 0, 0, 0];
                document.getElementById('scoreTableBody').innerHTML = '';
                document.getElementById('setupSection').style.display = 'flex';
                document.getElementById('gameSection').style.display = 'none';
            }
        }
    </script>
</body>
</html>
